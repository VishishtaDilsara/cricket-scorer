# Tests never read .env, so they can never touch the real database.
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=wicketly
spring.flyway.schemas=wicketly
spring.flyway.default-schema=wicketly
app.jwt-secret=test-secret-test-secret-test-secret-0001
app.cors-origins=http://localhost:5173
