spring.application.name=wicketly
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/wicketly;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=wicketly
# Own schema: keeps tables out of Supabase's auto-generated public REST API.
spring.flyway.schemas=wicketly
spring.flyway.default-schema=wicketly

app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-0001}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
